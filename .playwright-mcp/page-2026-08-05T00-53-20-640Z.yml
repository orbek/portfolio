            - heading "GrantLens" [level=3] [ref=e132]
            - paragraph [ref=e133]: AI-powered grant discovery platform for US nonprofits. Aggregates and deduplicates federal, state, county, and foundation opportunities (Grants.gov, SAM.gov, USASpending, state portals, and foundations) into one search, ranks them against each org's mission using OpenAI embeddings over pgvector, and predicts eligibility against 174 requirements across 22 funders before you apply.
            - paragraph [ref=e134]: Live SaaS replacing weeks of manual portal-hopping — with AI matching, a readiness engine, LOI drafting, funder intelligence, and an MCP server exposing 10 tools to Claude.
