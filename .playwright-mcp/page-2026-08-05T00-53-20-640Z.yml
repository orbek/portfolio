          - generic [ref=e205]:
            - heading "Enterprise Voice Agents" [level=3] [ref=e206]
            - paragraph [ref=e207]: Two open-source, production-shaped voice-agent reference architectures for regulated domains, on a shared half-cascade LiveKit + SIP pipeline (native audio → text LLM → streaming TTS) with safety guardrails enforced in code, not prompts. PatientLine is a HIPAA-aware patient-access agent (no medical advice, no refill approvals, no PHI before identity verification); WillCall is a PCI-aware ticketing agent whose architecture keeps card data entirely out of the AI environment.
            - paragraph [ref=e208]: "Safety is mechanically provable: release-blocking CI evals enforce zero clinical advice / zero refill approvals (PatientLine) and a Luhn-checked scan proving zero card numbers in any transcript or log (WillCall) — shipped with Terraform IaC, BAA/PCI data-flow mapping, and ADRs defending every decision."
            - link "Source" [ref=e210] [cursor=pointer]:
              - /url: https://github.com/orbek/voice-agent-reference-architectures
